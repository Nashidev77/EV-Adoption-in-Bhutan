# Colour theme for the whole app.
# Streamlit reads this file automatically; there is nothing to import.

[theme]
base = "dark"
primaryColor = "#66FCF1"              # buttons, sliders, selected tab
backgroundColor = "#0B0C10"           # main page background
secondaryBackgroundColor = "#1F2833"  # cards, tables, code blocks
textColor = "#C5C6C7"                 # body text
font = "sans serif"
